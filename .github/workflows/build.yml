name: Build WARP

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine branch label
      id: branch
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RAW="${{ github.base_ref }}"
        else
          RAW="${{ github.ref_name }}"
        fi
        # main/master -> releasepreview, everything else keeps its branch name
        if [ "$RAW" = "main" ] || [ "$RAW" = "master" ]; then
          LABEL="releasepreview"
        else
          LABEL="$RAW"
        fi
        echo "raw=$RAW" >> "$GITHUB_OUTPUT"
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"
        echo "Branch: $RAW  Label: $LABEL"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build ARM64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=ARM64 /m

    - name: Build x64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x64 /m

    - name: Build x86
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x86 /m

    - name: Stage artifacts
      shell: pwsh
      run: |
        $platforms = @(
          @{ arch = "ARM64"; src = "ARM64/Release" },
          @{ arch = "x64";   src = "x64/Release"   },
          @{ arch = "x86";   src = "Release"        }
        )

        foreach ($p in $platforms) {
          $staging = "artifacts/$($p.arch)/WARP"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "$($p.src)/WARP!.exe" "$staging/WARP!.exe" -Force
          Copy-Item "WARP - Readme.txt" "$staging/WARP - Readme.txt" -Force
          Write-Host "Staged $($p.arch): $staging"
        }

    - name: Upload ARM64 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-ARM64
        path: artifacts/ARM64/WARP
        if-no-files-found: error

    - name: Upload x64 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-x64
        path: artifacts/x64/WARP
        if-no-files-found: error

    - name: Upload x86 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-x86
        path: artifacts/x86/WARP
        if-no-files-found: error