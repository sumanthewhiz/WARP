name: Build WARP

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing runs only when a certificate is configured (ENG-5); unsigned otherwise.
      HAS_SIGNING_CERT: ${{ secrets.WARP_SIGN_CERT_PFX_B64 != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine branch label
      id: branch
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RAW="${{ github.base_ref }}"
        else
          RAW="${{ github.ref_name }}"
        fi
        # main/master -> releasepreview, else keep its branch name
        if [ "$RAW" = "main" ] || [ "$RAW" = "master" ]; then
          LABEL="releasepreview"
        else
          LABEL="$RAW"
        fi
        echo "raw=$RAW" >> "$GITHUB_OUTPUT"
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"
        echo "Branch: $RAW  Label: $LABEL"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore "WARP!.sln" -PackagesDirectory ../packages
        # ORT 1.23.0 (transitively required by ORT-GenAI 0.14.1) no
        # longer ships its win-x86 native binaries, but WARP still
        # builds an x86 configuration (purely for backward compat;
        # x86 never links the LLM polisher).  Side-install the last
        # ORT release that still publishes win-x86 onnxruntime.lib so
        # the x86 link step has something to point at.  x64 / ARM64
        # builds continue to use the version restored by
        # `nuget restore` (1.23.0).
        nuget install Microsoft.ML.OnnxRuntime -Version 1.22.0 -OutputDirectory ../packages -DependencyVersion Ignore

    - name: Download and verify model inputs (pinned, SEC-2)
      shell: pwsh
      run: |
        # granite-embedding-small-english-r2 (ModernBERT INT8 ONNX + the upstream tokenizer.json)
        # and the optional Qwen3-0.6B ORT-GenAI bundle. scripts/fetch_models.ps1 downloads from
        # immutable resolve/<commit> URLs and verifies every file (pinned SHA-256 in
        # scripts/models.lock.json, else the hashes Hugging Face publishes). Release branches
        # require full pins. It also writes the refiner's thread cap into genai_config.json (PERF-1).
        $release = '${{ github.ref_name }}' -in @('main', 'master')
        ./scripts/fetch_models.ps1 -RequirePinned:$release

        # Extract the flat vocab.txt + merges.txt + special_tokens.txt the C++
        # ModernBertTokenizer consumes (it deliberately has no JSON parser dependency);
        # scripts/modernbert_tokenizer_ref.py is verified bit-exact against transformers.
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet regex
        python scripts/extract_modernbert_tokenizer.py "models/granite/tokenizer.json" "models/granite"
        if ($LASTEXITCODE -ne 0) { throw "tokenizer extraction failed" }
        Remove-Item "models/granite/tokenizer.json" -Force

    - name: Detect available VC toolset
      id: toolset
      shell: pwsh
      run: |
        $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vsWhere -latest -property installationPath
        $vcToolsDir = Join-Path $installPath "VC\Tools\MSVC"
        $versions = Get-ChildItem $vcToolsDir -Directory | Sort-Object { [version]$_.Name } -Descending
        $latestVersion = $versions[0].Name
        # ENG-2: the platform toolset is not "v1" + the first minor digit. MSVC 14.30-14.49 are
        # all v143 (VS 2022); 14.50+ is v145 (VS 2026); 14.20-14.29 is v142 (VS 2019).
        $v = [version]$latestVersion
        if ($v.Major -ne 14) { throw "Unexpected MSVC tools version $latestVersion" }
        $toolset = switch ($v.Minor) {
          { $_ -ge 50 } { 'v145'; break }
          { $_ -ge 30 } { 'v143'; break }
          { $_ -ge 20 } { 'v142'; break }
          default       { throw "MSVC $latestVersion is too old (VS 2019 or newer is required)" }
        }
        Write-Host "Detected VC tools version: $latestVersion -> PlatformToolset=$toolset"
        echo "value=$toolset" >> $env:GITHUB_OUTPUT

    - name: Build ARM64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=ARM64 /p:PlatformToolset=${{ steps.toolset.outputs.value }} /m

    - name: Build x64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ steps.toolset.outputs.value }} /m

    # ENG-1: C++ unit tests (store, API, canonicalizers, capture rules, concurrency stress).
    - name: Build C++ unit tests (x64)
      run: msbuild tests\WarpTests.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ steps.toolset.outputs.value }} /m

    - name: Native regressions and signal quality gates (x64)
      timeout-minutes: 20
      shell: pwsh
      run: |
        python tests\eval\signal_quality.py --native-bin build\tests\x64\Release\WarpTests.exe --output-dir build\signal-quality
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Exercise the optional encoder path against the same evidence, using the
        # model bundle already downloaded above. No Qwen/refiner is enabled.
        python tests\eval\signal_quality.py --native-bin build\tests\x64\Release\WarpTests.exe --models-dir models --output-dir build\signal-quality\granite
        exit $LASTEXITCODE

    - name: Upload signal quality evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signal-quality-x64
        path: build/signal-quality/
        if-no-files-found: warn

    # ENG-3: start the real binary headless against a temp data directory, query the live pipe
    # (including as a filtered, medium-integrity "standard user" client), drive scripted activity,
    # then stop it through its shutdown event.
    - name: Integration test - headless WARP + live API (x64)
      timeout-minutes: 15
      shell: pwsh
      run: |
        python -m pip install --quiet --disable-pip-version-check -r tests/requirements.txt
        # The first-run consent dialog would block a headless start; acknowledge it for the CI user.
        New-Item -Path 'HKCU:\Software\WARP' -Force | Out-Null
        New-ItemProperty -Path 'HKCU:\Software\WARP' -Name ConsentAcknowledged -Value 1 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path 'HKCU:\Software\WARP' -Name EncryptDataDir -Value 0 -PropertyType DWord -Force | Out-Null
        $data = Join-Path $env:RUNNER_TEMP 'warp-data'
        $exe = (Resolve-Path 'x64/Release/WARP!.exe').Path
        $proc = Start-Process -FilePath $exe -ArgumentList @('--headless', '--data-dir', "`"$data`"") -PassThru
        $env:WARP_LIVE_API = '1'
        $env:WARP_PID = "$($proc.Id)"
        $rc = 1
        try {
          python -m pytest tests/python/test_live_api.py -m live -v -rA --tb=short
          $rc = $LASTEXITCODE
          Write-Host '----- WARP!.exe --status (CLI against the running instance)'
          $statusOut = Join-Path $env:RUNNER_TEMP 'warp-status.json'
          $cli = Start-Process -FilePath $exe -ArgumentList '--status' -RedirectStandardOutput $statusOut -PassThru -NoNewWindow
          if ($cli.WaitForExit(20000)) { Get-Content -LiteralPath $statusOut | Out-Host }
          else { Stop-Process -Id $cli.Id -Force; Write-Host '::warning::WARP!.exe --status did not return within 20 s' }
        }
        finally {
          try {
            $evt = [System.Threading.EventWaitHandle]::OpenExisting('Local\WARP-ShutdownRequest')
            [void]$evt.Set()
            $evt.Dispose()
          }
          catch { Write-Host "shutdown event not available: $($_.Exception.Message)" }
          if (-not $proc.WaitForExit(30000)) {
            Write-Host '::error::WARP did not exit within 30 s of the shutdown request'
            Stop-Process -Id $proc.Id -Force
            if ($rc -eq 0) { $rc = 1 }
          }
          else { Write-Host "WARP exited with code $($proc.ExitCode)" }
          Get-ChildItem -Path (Join-Path $data 'logs') -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "----- $($_.Name)"
            Get-Content -LiteralPath $_.FullName -Tail 300
          }
        }
        exit $rc

    - name: Build x86
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=${{ steps.toolset.outputs.value }} /m

    - name: Stage artifacts
      shell: pwsh
      run: |
        # x64 and ARM64 ship the LLM polishing layer -- bundled
        # Qwen3-0.6B + onnxruntime-genai.dll are required and the
        # staging step fails if either is missing.  x86 ships without
        # the polisher (the ORT-GenAI NuGet has no win-x86 binaries),
        # so its staging skips both.
        $platforms = @(
          @{ arch = "ARM64"; src = "ARM64/Release"; hasLlm = $true  },
          @{ arch = "x64";   src = "x64/Release";   hasLlm = $true  },
          @{ arch = "x86";   src = "Release";       hasLlm = $false }
        )

        # Apache-2.0 text for the bundled models' license (best effort; NOTICE.md links it too).
        $apacheText = Join-Path $env:RUNNER_TEMP 'Apache-2.0.txt'
        try { Invoke-WebRequest -Uri 'https://www.apache.org/licenses/LICENSE-2.0.txt' -OutFile $apacheText -TimeoutSec 60 }
        catch { Write-Host "::warning::Apache-2.0 license text could not be downloaded: $($_.Exception.Message)"; $apacheText = $null }

        foreach ($p in $platforms) {
          $staging = "artifacts/$($p.arch)/WARP"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging/models" -Force | Out-Null
          Copy-Item "$($p.src)/WARP!.exe" "$staging/WARP!.exe" -Force
          Copy-Item "$($p.src)/onnxruntime.dll" "$staging/onnxruntime.dll" -Force

          # Granite embedding model.  Required on every platform -- the
          # post-build target copies the whole models/granite/ subtree
          # into $(OutDir), so failing here means the download step
          # never populated it.
          $granite = "$($p.src)/models/granite"
          if (!(Test-Path $granite)) {
            throw "Missing $granite -- the granite-embedding-small-english-r2 model subtree is mandatory for $($p.arch) but was not staged into the build output.  The 'Download sentence-encoder model' step should have populated models/granite/."
          }
          Copy-Item $granite "$staging/models/granite" -Recurse -Force
          Write-Host "Bundled granite-embedding-small-english-r2 into $staging/models/granite"

          if ($p.hasLlm) {
            # Required: ORT-GenAI runtime + Qwen3-0.6B model subtree.
            $genaiDll = "$($p.src)/onnxruntime-genai.dll"
            if (!(Test-Path $genaiDll)) {
              throw "Missing $genaiDll -- the LLM polishing layer is mandatory for $($p.arch) but its runtime DLL was not produced by the build."
            }
            Copy-Item $genaiDll "$staging/onnxruntime-genai.dll" -Force

            $qwen = "$($p.src)/models/qwen"
            if (!(Test-Path $qwen)) {
              throw "Missing $qwen -- the Qwen3-0.6B model subtree is mandatory for $($p.arch) but was not staged into the build output.  The 'Download LLM polishing model' step should have populated models/qwen/."
            }
            Copy-Item $qwen "$staging/models/qwen" -Recurse -Force
            Write-Host "Bundled Qwen3-0.6B model into $staging/models/qwen"
          }
          else {
            # x86: explicitly skip the LLM artefacts even if the
            # post-build target somehow copied them (defence in depth).
            Write-Host "Skipping Qwen model bundle for $($p.arch) (LLM polishing layer unavailable on this platform)"
          }

          Copy-Item "WARP - Readme.txt" "$staging/WARP - Readme.txt" -Force
          Copy-Item "NOTICE.md" "$staging/NOTICE.md" -Force
          Copy-Item "API.md" "$staging/API.md" -Force
          Copy-Item "SCHEMA.md" "$staging/SCHEMA.md" -Force

          # Upstream license files (ENG-5 / SEC-2): ONNX Runtime packages, Apache-2.0 for the models.
          $lic = "$staging/licenses"
          New-Item -ItemType Directory -Path $lic -Force | Out-Null
          $ortVersion = if ($p.arch -eq 'x86') { '1.22.0' } else { '1.23.0' }
          $pkgs = @(@{ dir = "../packages/Microsoft.ML.OnnxRuntime.$ortVersion"; prefix = 'onnxruntime' })
          if ($p.hasLlm) { $pkgs += @{ dir = '../packages/Microsoft.ML.OnnxRuntimeGenAI.0.14.1'; prefix = 'onnxruntime-genai' } }
          foreach ($pkg in $pkgs) {
            if (!(Test-Path $pkg.dir)) { Write-Host "::warning::$($pkg.dir) not found; its license files are not bundled"; continue }
            Get-ChildItem $pkg.dir -File | Where-Object { $_.Name -match '^(LICENSE|ThirdPartyNotices)' } | ForEach-Object {
              Copy-Item $_.FullName (Join-Path $lic "$($pkg.prefix)-$($_.Name)") -Force
            }
          }
          if ($apacheText) { Copy-Item $apacheText "$lic/Apache-2.0.txt" -Force }
          Write-Host "Staged $($p.arch): $staging"
        }

    - name: Sign WARP binaries (only when a signing certificate is configured)
      if: env.HAS_SIGNING_CERT == 'true'
      shell: pwsh
      env:
        CERT_B64: ${{ secrets.WARP_SIGN_CERT_PFX_B64 }}
        CERT_PASSWORD: ${{ secrets.WARP_SIGN_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP 'warp-sign.pfx'
        [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:CERT_B64))
        try {
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' |
                      Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          foreach ($f in Get-ChildItem artifacts -Recurse -Filter 'WARP!.exe') {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d WARP $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($f.FullName)" }
          }
        }
        finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

    - name: Note unsigned build
      if: env.HAS_SIGNING_CERT != 'true'
      shell: pwsh
      run: |
        "> **Unsigned build** - configure the WARP_SIGN_CERT_PFX_B64 / WARP_SIGN_CERT_PASSWORD secrets to Authenticode-sign WARP!.exe." |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    - name: Write SHA256SUMS
      shell: pwsh
      run: |
        foreach ($arch in 'ARM64', 'x64', 'x86') {
          $root = (Resolve-Path "artifacts/$arch/WARP").Path
          $lines = Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
                   Sort-Object FullName | ForEach-Object {
                     $rel = [System.IO.Path]::GetRelativePath($root, $_.FullName)
                     '{0} *{1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $rel
                   }
          Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt') -Value $lines -Encoding utf8
          Write-Host "${arch}: $($lines.Count) files hashed"
        }

    - name: Upload ARM64 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-ARM64
        path: artifacts/ARM64
        if-no-files-found: error

    - name: Upload x64 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-x64
        path: artifacts/x64
        if-no-files-found: error

    - name: Upload x86 zip
      uses: actions/upload-artifact@v4
      with:
        name: WARP-${{ steps.branch.outputs.label }}-x86
        path: artifacts/x86
        if-no-files-found: error

  # ----------------------------------------------------------------
  # Python test suite (TEST_PLAN.md L1 + L1-property + L2 layers).
  #
  # Runs in parallel with `build` since it has no MSBuild / model-file
  # dependency -- only Python + pytest + hypothesis (installed in
  # ~5 s).  Full pytest suite completes in < 10 s.  Fully local: no
  # cloud LLM, no API key, no model download.
  #
  # Trigger independently:
  #   .\tests\run_tests.ps1                # everything
  #   .\tests\run_tests.ps1 -Layer l1      # just L1
  #   python tests/run_tests.py --list     # discovery
  # ----------------------------------------------------------------
  tests:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: tests/requirements.txt

    - name: Install test dependencies
      run: |
        python -m pip install --quiet --disable-pip-version-check -r tests/requirements.txt

    - name: Run L1 deterministic tests
      run: python tests/run_tests.py --tier python --layer l1

    - name: Run L1 property-based tests (Hypothesis)
      run: python tests/run_tests.py --tier python --layer l1_property

    - name: Run L2 model-contract + adversarial tests
      run: python tests/run_tests.py --tier python --layer l2

    - name: Run L3 eval / quality tests
      run: python tests/run_tests.py --tier python --layer l3

    - name: Run legacy standalone scripts (regression smoke)
      run: python tests/run_tests.py --tier scripts