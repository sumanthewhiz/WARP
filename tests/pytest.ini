[pytest]
testpaths = python eval
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    l1: layer 1 deterministic tests
    l1_property: layer 1 property-based tests
    l2: layer 2 model-contract tests
    l3: layer 3 eval / quality tests
    needs_models: requires ONNX models on disk
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
