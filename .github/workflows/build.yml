name: Build WARP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build ARM64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=ARM64 /m

    - name: Build x64
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x64 /m

    - name: Build x86
      run: msbuild "WARP!.sln" /p:Configuration=Release /p:Platform=x86 /m

    - name: Upload ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: WARP-ARM64
        path: binaries/ARM64/
        if-no-files-found: error

    - name: Upload x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: WARP-x64
        path: binaries/x64/
        if-no-files-found: error

    - name: Upload x86 artifact
      uses: actions/upload-artifact@v4
      with:
        name: WARP-x86
        path: binaries/x86/
        if-no-files-found: error

    - name: Commit updated binaries
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add binaries/ -f
        git diff --cached --quiet || git commit -m "Update binaries for ARM64, x64, x86 [skip ci]"
        git push